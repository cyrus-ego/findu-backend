name: Build and Push Docker Image

on:
  push:
    branches: [main, release1.0.0]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: image-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.image-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Validate VPS SSH secret
        env:
          VPS_HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${VPS_HOST:-}" || -z "${VPS_USER:-}" || -z "${VPS_SSH_KEY:-}" ]]; then
            echo "::error::Missing one or more VPS secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY."
            exit 1
          fi

          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/tmp/vps_ssh_key_error; then
            echo "::error::VPS_SSH_KEY is not a valid private key. Paste the full private key, including BEGIN/END lines."
            cat /tmp/vps_ssh_key_error
            exit 1
          fi

          echo "Deploy target: ${VPS_USER}@${VPS_HOST}"
          echo "VPS_SSH_KEY public fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key.pub

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        with:
          host: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          username: ${{ vars.VPS_USER || secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,REPO,REF_NAME
          script: |
            set -euo pipefail
            mkdir -p ~/dev/findu-backend
            cd ~/dev/findu-backend
            curl -fsSL \
              "https://raw.githubusercontent.com/${REPO}/${REF_NAME}/docker-compose.prod.yml" \
              -o docker-compose.prod.yml

            if [[ -n "${GHCR_TOKEN:-}" ]]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin \
                || echo "GHCR login failed — continuing (public image may still pull)"
            fi

            export APP_IMAGE_TAG="${IMAGE_TAG}"
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps

            # Dọn dẹp các image cũ
            echo "=== Cleaning up old images ==="
            docker image prune -f --filter "until=24h"
            # Xoá các image cũ của findu-backend, giữ lại 2 image gần nhất
            docker image ls "ghcr.io/$REPO" -q | tail -n +3 | xargs -r docker image rm -f 2>/dev/null || true
