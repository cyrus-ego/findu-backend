# Production: pull pre-built image from GHCR (built locally or by GitHub Actions).
# Usage on VPS:
#   export IMAGE_TAG=latest   # or full git sha / v1.0.0
#   docker compose -f docker-compose.prod.yml --env-file .env.pod pull app
#   docker compose -f docker-compose.prod.yml --env-file .env.pod up -d

services:
  mongo:
    image: mongo:7
    container_name: ${MONGO_CONTAINER_NAME:-findu-mongo}
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-findu-redis}
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  app:
    image: ${IMAGE_NAME:-ghcr.io/cyrus-ego/findu-backend}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-findu-app}
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${APP_PORT:-3001}:${PORT:-3000}"
    env_file:
      - .env.pod
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      MONGODB_URI: mongodb://mongo:27017/strangerconfide
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - app-uploads:/app/uploads
      - "${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:?Set FIREBASE_SERVICE_ACCOUNT_HOST_PATH in .env.pod}:/run/secrets/firebase-service-account.json:ro"

volumes:
  mongo-data:
  redis-data:
  app-uploads:
